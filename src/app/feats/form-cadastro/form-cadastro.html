<form>

<label for="nome">Nome completo</label>
<input id="nome" type="text" placeholder="Nome e sobrenome">

<label for="email">E-mail</label>
<input id="email" type="email" placeholder="email@gmail.com">

<label for="CPF">CPF</label>
<input id="CPF" type="text" placeholder="000.000.000-00"> 

<label for="phone">Telefone</label>
<input id="phone" type="tel" placeholder="(00) 99999-9999">

<label for="CEP">CEP</label>
<input id="CEP" type="text" placeholder="00000-000">

<label for="password">Senha</label>
<input id="password" type="password" placeholder="Crie uma senha forte">

<label for="check">Li e aceito os <span>termos de uso</span></label>
<input id="check" type="checkbox">

<button>Criar conta</button>

<p>Já tem uma conta? <a routerLink="/login">Entrar</a> </p>
</form>
