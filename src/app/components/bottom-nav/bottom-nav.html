<nav aria-label="Navegação principal">
    @for (item of itens; track item.id) {
      @if ($index === 2) {
        <button
          type="button"
          class="adicionar"
          aria-label="Nova ocorrência"
          (click)="adicionar.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      }
  
      <button
        type="button"
        class="item"
        [class.ativo]="ativa() === item.id"
        [attr.aria-current]="ativa() === item.id ? 'page' : null"
        (click)="selecionar.emit(item.id)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="item.icone" />
        </svg>
        <span>{{ item.nome }}</span>
      </button>
    }
  </nav>
